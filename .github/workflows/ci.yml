name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint skills, manifest, Matt name clashes and docs links
        run: node scripts/lint-skills.mjs
      - name: Script tests
        run: node --test "scripts/**/*.test.mjs" "skills/**/*.test.mjs"
      - name: Matt skills snapshot matches upstream
        run: node scripts/matt-skills.mjs check
