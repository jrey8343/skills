# Rendered by /schedule-audits into .github/workflows/claude-audits.yml.
#
# Placeholders: {{...}}. Lines marked `# if:<condition>` are kept only when the
# condition holds (then the marker is removed). Everything else is copied as is.
#
# Shape: plan (deterministic) -> analyse (one model run per audit, read-only)
#        -> publish (deterministic script, the only job with issues: write).
# The model that reads untrusted text never holds write access.
#
# VERIFY when rendering. All four were confirmed end to end in October 2026 with
# claude-code-action v1 and Claude Code 2.1.302; recheck if either has moved on:
#   - claude-code-action's `structured_output` output when `--json-schema` is passed.
#   - File writes are checked against Edit(path) rules only; a Write(path) rule is
#     never consulted, so the temp-dir allow below is written as Edit(...).
#   - `--append-system-prompt` inside `claude_args` reaches the model.
#   - Expressions in job-level `timeout-minutes`.

# Generated by /schedule-audits from docs/agents/audits.md. Edit that file and re-run the skill; don't hand-edit.
name: claude-audits

on:
  schedule:
{{#each audits}}
    - cron: "{{cron}}" # {{audit}}
{{/each}}
  workflow_dispatch:
    inputs:
      audit:
        description: Audit to run
        type: choice
        options:
{{#each audits}}
          - {{audit}}
{{/each}}
      scope:
        description: incremental (changes since the last run) or full
        type: choice
        options: [incremental, full]
        default: incremental
      dry_run:
        description: Plan issue changes without writing them
        type: boolean
        default: true

permissions: {}

concurrency:
  group: claude-audits-${{ github.event.schedule || inputs.audit }}
  cancel-in-progress: false

env:
  SKILLS_REPO: jrey8343/skills
  SKILLS_REF: {{skills_sha}} # pinned commit; bump deliberately
  NODE_VERSION: "22"
  PLAYWRIGHT_MCP_VERSION: "{{playwright_mcp_version}}" # if:persona-review
  SCHEDULED_DRY_RUN: "{{scheduled_dry_run}}" # "true" for the first week of scheduled runs, then "false"
  # One line per audit, rendered from docs/agents/audits.md (defaults merged in).
  AUDITS_JSON: >-
    {{audits_json}}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SKILLS_REPO }}
          ref: ${{ env.SKILLS_REF }}
          path: .skills
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Pick the audits that are due
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_AUDIT: ${{ inputs.audit }}
          INPUT_SCOPE: ${{ inputs.scope }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          node --input-type=module <<'EOF' >> "$GITHUB_OUTPUT"
          import { execFileSync } from "node:child_process";
          const auditsMax = 20;
          const audits = JSON.parse(process.env.AUDITS_JSON);
          if (!Array.isArray(audits) || audits.length > auditsMax) throw new Error("AUDITS_JSON must be an array of at most 20 audits");
          const scheduled = process.env.EVENT_SCHEDULE;
          const selected = scheduled
            ? audits.filter((audit) => audit.cron === scheduled)
            : audits.filter((audit) => audit.audit === process.env.INPUT_AUDIT);
          const scope = process.env.INPUT_SCOPE || "incremental";
          const dryRun = scheduled ? process.env.SCHEDULED_DRY_RUN === "true" : process.env.INPUT_DRY_RUN === "true";
          const publisher = ".skills/skills/audits/report-findings/scripts/publish-findings.mjs";
          const due = [];
          for (const audit of selected) {
            let since = "";
            if (audit.diff_scoped && scope === "incremental") {
              const lastSha = execFileSync("node", [publisher, "last-sha", audit.audit], { encoding: "utf8" }).trim();
              since = lastSha;
              if (lastSha) {
                let commits = -1;
                try {
                  commits = Number(execFileSync("git", ["rev-list", "--count", `${lastSha}..HEAD`], { encoding: "utf8" }).trim());
                } catch {
                  commits = -1; // previous SHA unreachable: run with the audit's own fallback
                }
                if (commits === 0) {
                  console.error(`skip ${audit.audit}: no commits since ${lastSha}`);
                  continue;
                }
              }
            }
            due.push({ ...audit, scope, since, dry_run: dryRun });
          }
          console.log(`matrix=${JSON.stringify({ include: due })}`);
          console.log(`any=${due.length > 0}`);
          EOF

  analyse:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    # The audits' own environment (deployment branches: the default branch only)
    # holds the audits' OP_SERVICE_ACCOUNT_TOKEN, so this job never sees a deploy
    # environment's service account or the write-scoped tokens in its vault.
    environment: audits
    permissions:
      contents: read
      issues: read # incremental scope reads the last tracking issue
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SKILLS_REPO }}
          ref: ${{ env.SKILLS_REF }}
          path: .skills
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Load secrets (only what this job needs)
        id: op
        uses: 1password/load-secrets-action@v5
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: op://{{ci_vault}}/CLAUDE_CODE_OAUTH_TOKEN/password
          SENTRY_AUTH_TOKEN: op://{{ci_vault}}/SENTRY_AUTH_TOKEN/password # if:sentry
          CLOUDFLARE_API_TOKEN: op://{{ci_vault}}/CLOUDFLARE_API_TOKEN/password # if:cloudflare

      # The browser build must match the playwright version the MCP server pins.
      - name: Install a browser for live persona review # if:persona-review
        if: matrix.audit == 'persona-review' # if:persona-review
        run: npx -y "playwright@$(npm view "@playwright/mcp@$PLAYWRIGHT_MCP_VERSION" dependencies.playwright)" install --with-deps chromium # if:persona-review

      - name: Write MCP config (outside the workspace)
        env:
          SENTRY_AUTH_TOKEN: ${{ steps.op.outputs.SENTRY_AUTH_TOKEN }} # if:sentry
          CLOUDFLARE_API_TOKEN: ${{ steps.op.outputs.CLOUDFLARE_API_TOKEN }} # if:cloudflare
          AUDIT: ${{ matrix.audit }}
        run: |
          umask 077
          node --input-type=module <<'EOF' > "$RUNNER_TEMP/mcp.json"
          const servers = {};
          if (process.env.SENTRY_AUTH_TOKEN) {
            servers.sentry = { type: "http", url: "https://mcp.sentry.dev/mcp", headers: { Authorization: `Sentry-Bearer ${process.env.SENTRY_AUTH_TOKEN}` } };
          }
          if (process.env.CLOUDFLARE_API_TOKEN) {
            servers.cloudflare = { type: "http", url: "https://mcp.cloudflare.com/mcp", headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` } };
          }
          if (process.env.AUDIT === "persona-review") {
            const outputDir = `${process.env.RUNNER_TEMP}/playwright-output`;
            servers.playwright = { command: "npx", args: ["-y", `@playwright/mcp@${process.env.PLAYWRIGHT_MCP_VERSION}`, "--headless", "--isolated", "--browser", "chromium", "--output-dir", outputDir] };
          }
          console.log(JSON.stringify({ mcpServers: servers }));
          EOF

      # Claude Code's --json-schema rejects the draft 2020-12 `$schema` key
      # ("no schema with key or ref"), so it is dropped here; the rest of the
      # schema is unchanged.
      - name: Compact the findings schema
        id: schema
        run: |
          # shellcheck disable=SC2016 # single quotes on purpose: $schema is a JS property, not a shell variable
          echo "json=$(node -e 'const schema = require(process.argv[1]); delete schema.$schema; process.stdout.write(JSON.stringify(schema))' "$PWD/.skills/skills/audits/report-findings/FINDINGS-SCHEMA.json")" >> "$GITHUB_OUTPUT"

      # Permissions: Claude Code checks file writes against Edit(path) rules
      # only (a Write(path) rule is never consulted), and a bare `Edit` deny
      # removes the Edit tool without touching those path checks. So Write may
      # create top-level .json and .html files in the runner temp dir (the
      # architecture HTML report) and nothing else: not the checkout, not the
      # runner's command files in its subdirectories. The subagent tool is
      # `Agent`. --strict-mcp-config ignores the repo's own .mcp.json, whose
      # OAuth servers may share these names.
      #
      # The appended system prompt gives the model what it can't work out: where
      # $RUNNER_TEMP is, that its final message is the output (the headless
      # contract otherwise spends turns trying to write findings.json and run
      # the publisher), and the shell habits the rules refuse (cd, git -C,
      # loops, node). Subagents don't see it, hence its last sentence. Add any
      # repo-specific context (a live target the job boots, say) to this same
      # string rather than a second flag.
      #
      # Background tasks are off so explorer subagents finish before the
      # structured output. With them on, an audit can return while its
      # explorers are still running, and their findings are lost.
      - name: Run the audit
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ steps.op.outputs.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }} # read-only job token; no Claude GitHub App needed for analysis
          plugin_marketplaces: ./.skills
          plugins: jrey-skills@jrey8343
          prompt: "/jrey-skills:${{ matrix.audit }} headless ${{ matrix.scope }}${{ matrix.since && format(' since={0}', matrix.since) || '' }}${{ matrix.dry_run && ' dry-run' || '' }}"
          claude_args: >-
            --model ${{ matrix.model }}
            --max-turns ${{ matrix.max_turns }}
            --mcp-config ${{ runner.temp }}/mcp.json
            --strict-mcp-config
            --allowedTools "Read,Grep,Glob,Skill,Agent,Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git rev-parse:*),Bash(git rev-list:*),Bash(git ls-files:*),Bash(git blame:*),Bash(printenv GITHUB_ACTIONS),Edit(/${{ runner.temp }}/*.json),Edit(/${{ runner.temp }}/*.html),mcp__sentry__*,mcp__cloudflare__*,mcp__playwright__*"
            --disallowedTools "Edit,NotebookEdit,WebFetch,WebSearch"
            --json-schema '${{ steps.schema.outputs.json }}'
            --append-system-prompt "This run is on a GitHub Actions runner. Your final message is captured as structured output and a separate publish job files it, so do not write findings.json or run the publisher, and leave both out of the summary. RUNNER_TEMP is ${{ runner.temp }}: write any HTML report with the Write tool directly in that directory, not in a subdirectory. The shell allows read-only git and read-only commands only; there is no package manager and no network. It already starts in the repository root: do not use cd, git -C, for or while loops, or node, which the permission rules refuse. Pipes and chains of read-only commands work. Subagents do not see this prompt, so include these shell rules in the instructions of any subagent you start."

      # The result message lists every tool call the permission rules refused.
      # Only the tool and the start of its input reach the log.
      - name: Report permission denials
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          jq -r '(if type == "array" then .[] else . end) | select(.type? == "result") | .permission_denials[]? | "\(.tool_name): \(.tool_input | tostring | .[0:200])"' "$EXECUTION_FILE" || true

      - name: Save findings
        env:
          FINDINGS: ${{ steps.claude.outputs.structured_output }}
        run: |
          mkdir -p findings
          printf '%s' "$FINDINGS" > findings/findings.json
          # shellcheck disable=SC2016 # single quotes on purpose: ${...} is a JS template literal
          node -e 'const r = JSON.parse(require("fs").readFileSync("findings/findings.json", "utf8")); if (!Array.isArray(r.findings)) process.exit(1); console.log(`${r.findings.length} findings`)'

      # Runs even after a failed audit, so the reports artifact below is
      # checked too: the model writes the HTML reports.
      - name: Refuse to publish secret values
        id: leak
        if: always()
        env:
          SECRET_1: ${{ steps.op.outputs.CLAUDE_CODE_OAUTH_TOKEN }}
          SECRET_2: ${{ steps.op.outputs.SENTRY_AUTH_TOKEN }} # if:sentry
          SECRET_3: ${{ steps.op.outputs.CLOUDFLARE_API_TOKEN }} # if:cloudflare
        run: |
          shopt -s nullglob
          files=(findings/findings.json "$RUNNER_TEMP"/*.html)
          for name in SECRET_1 SECRET_2 SECRET_3; do
            value="${!name:-}"
            for file in "${files[@]}"; do
              if [ -n "$value" ] && [ -f "$file" ] && grep -qF -- "$value" "$file"; then
                echo "::error::$(basename "$file") contains a loaded secret value; refusing to publish"
                exit 1
              fi
            done
          done

      # Two artifacts, not one: upload-artifact roots a multi-path artifact at
      # the paths' common ancestor, so findings.json uploaded beside a file in
      # the runner temp dir lands under <repo>/<repo>/findings/, and publish
      # silently skips any run that wrote an HTML report.
      - uses: actions/upload-artifact@v4
        with:
          name: findings-${{ matrix.audit }}
          path: findings/findings.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && steps.leak.outcome == 'success'
        with:
          name: reports-${{ matrix.audit }}
          path: |
            ${{ runner.temp }}/*.html
            ${{ runner.temp }}/playwright-output/ # if:persona-review
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: [plan, analyse]
    if: always() && needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SKILLS_REPO }}
          ref: ${{ env.SKILLS_REF }}
          path: .skills
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        id: download
        continue-on-error: true
        with:
          name: findings-${{ matrix.audit }}
          path: findings
      - name: Publish findings
        if: steps.download.outcome == 'success' && hashFiles('findings/findings.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node .skills/skills/audits/report-findings/scripts/publish-findings.mjs findings/findings.json
          --repo "${{ github.repository }}"
          --severity-min "${{ matrix.severity_min }}"
          --new-issues-max "${{ matrix.new_issues_max }}"
          --triage-label "{{triage_label}}"
          ${{ matrix.dry_run && '--dry-run' || '' }}

  # Optional, future work: apply `mechanical` findings with an `internal` source as PRs.
  # Disabled by default. Its only input is repository code (never Sentry, feedback or
  # email text). PRs are never auto-merged. It needs the Claude GitHub App token so CI
  # runs on the PRs it opens (PRs created with GITHUB_TOKEN don't trigger workflows).
  #
  # fix:
  #   needs: [plan, publish]
  #   if: needs.plan.outputs.any == 'true' && !contains(needs.plan.outputs.matrix, '"dry_run":true')
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 30
  #   permissions:
  #     contents: write
  #     pull-requests: write
  #     issues: read
  #     id-token: write
  #   steps:
  #     - uses: actions/checkout@v4
  #     - (load CLAUDE_CODE_OAUTH_TOKEN as in analyse)
  #     - uses: anthropics/claude-code-action@v1
  #       with:
  #         claude_code_oauth_token: ...
  #         prompt: >-
  #           For each open issue labelled mechanical-fix and audit:<name> created by this run,
  #           make the fix on branch audit/<name>/<fingerprint>, run the checks, and open a PR
  #           that references the issue. Do not merge.
  #         claude_args: --allowedTools "Read,Grep,Glob,Edit,Write,Bash(git:*),Bash(gh pr create:*),Bash(gh issue view:*),Bash(pnpm test:*)"
