  #   timeout-minutes: 30
  #   permissions:
  #     contents: write
  #     pull-requests: write
  #     issues: read
  #     id-token: write
  #   steps:
  #     - uses: actions/checkout@v4
  #     - (load CLAUDE_CODE_OAUTH_TOKEN as in analyse)
  #     - uses: anthropics/claude-code-action@v1
